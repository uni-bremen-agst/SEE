name: Issue task sync

"on":
  push:
    branches:
      - '**'
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  issues: write

concurrency:
  group: issue-task-sync-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      (github.event_name == 'push' && github.ref != 'refs/heads/master') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Synchronize issue checklist
        uses: actions/github-script@v9
        with:
          script: |
            // Supported branch names: refactor/961-description, fix/1022-description, ...
            // A Checks #N directive can update issue N only when N is in the branch name.
            function issueFromBranch(branch) {
              const match = branch.match(/^[a-z][a-z0-9_-]*\/([1-9]\d*)(?:[-/]|$)/i);
              return match === null ? null : Number(match[1]);
            }

            function normalize(value) {
              return value.trim().replace(/\s+/g, ' ');
            }

            const nimSuffix = /\s+🟡\s+\*\*NIM\*\*\s+<!--\s*issue-task-sync branch=([A-Za-z0-9_-]+)\s*-->\s*$/;

            function taskFromLine(line) {
              const match = line.match(/^\s*[-*+]\s+\[[ xX]\]\s+(.*)$/);
              return match === null
                ? null
                : normalize(match[1].replace(nimSuffix, ''));
            }

            function isChecked(line) {
              return /^\s*[-*+]\s+\[[xX]\]/.test(line);
            }

            const isPush = context.eventName === 'push';
            const pull = context.payload.pull_request;
            const branch = isPush
              ? context.ref.replace(/^refs\/heads\//, '')
              : pull?.head?.ref;

            if (!branch || (isPush && context.payload.deleted)) {
              core.info('No active branch to synchronize.');
              return;
            }

            const issueNumber = issueFromBranch(branch);
            if (issueNumber === null) {
              core.info(`Branch '${branch}' does not contain a supported issue number.`);
              return;
            }

            const marker = Buffer.from(branch).toString('base64url');
            const { owner, repo } = context.repo;

            if (!isPush && (!pull?.merged || pull?.head?.repo?.full_name !== `${owner}/${repo}`)) {
              core.info('Pull request was not merged from this repository.');
              return;
            }

            const issue = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issueNumber
            });

            // Issues and pull requests share an endpoint: never edit a PR body.
            if (issue.data.pull_request) {
              core.warning(`Number #${issueNumber} refers to a pull request, not an issue.`);
              return;
            }

            const lines = (issue.data.body ?? '').split('\n');
            let changes = 0;

            if (isPush) {
              const tasks = new Set();
              const commits = context.payload.commits ?? [];
              for (const commit of commits) {
                const pattern = /^Checks\s+#(\d+):\s*(.+)$/gmi;
                for (const match of commit.message.matchAll(pattern)) {
                  if (Number(match[1]) !== issueNumber) {
                    core.warning(`Ignoring Checks #${match[1]} on branch '${branch}'.`);
                    continue;
                  }
                  tasks.add(normalize(match[2]));
                }
              }

              for (const task of tasks) {
                const matches = [];
                for (let i = 0; i < lines.length; i++) {
                  if (taskFromLine(lines[i]) === task) {
                    matches.push(i);
                  }
                }

                if (matches.length !== 1) {
                  core.warning(`Expected exactly one checklist entry for '${task}', found ${matches.length}.`);
                  continue;
                }

                const index = matches[0];
                if (isChecked(lines[index])) {
                  core.info(`Already checked: '${task}'.`);
                  continue;
                }

                lines[index] = lines[index].replace(/\[\s\]/, '[x]') +
                  ` 🟡 **NIM** <!-- issue-task-sync branch=${marker} -->`;
                changes++;
                core.info(`Checked '${task}' in issue #${issueNumber}.`);
              }
            } else {
              // On merge, remove only NIM tags owned by this exact source branch.
              for (let i = 0; i < lines.length; i++) {
                if (!isChecked(lines[i])) {
                  continue;
                }
                const suffix = lines[i].match(nimSuffix);
                if (suffix !== null && suffix[1] === marker) {
                  lines[i] = lines[i].replace(nimSuffix, '');
                  changes++;
                }
              }
              core.info(`Removed ${changes} NIM markers after merging '${branch}'.`);
            }

            if (changes === 0) {
              core.info('Issue checklist is already up to date.');
              return;
            }

            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issueNumber,
              body: lines.join('\n')
            });
            core.info(`Updated issue #${issueNumber} (${changes} changes).`);
